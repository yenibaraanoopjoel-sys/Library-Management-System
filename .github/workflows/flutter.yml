name: Flutter CI

on:
  push:
    branches: [main, frontend]
  pull_request:
    branches: [main]

jobs:
  analyze_and_test:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      # NOTE: This is the FRONTEND-only branch (UI layer).
      # Models, providers, services and repositories live in the 'backend' branch.
      # Analyze and tests are non-blocking here since imports from the backend
      # layer are intentionally absent on this branch.
      - name: Analyze project source
        run: flutter analyze
        continue-on-error: true

      - name: Run unit tests
        run: flutter test
        continue-on-error: true
